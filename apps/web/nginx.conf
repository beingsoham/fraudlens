# nginx configuration for the FraudLens web client.
#
# Serves the built SPA and proxies the API and the WebSocket upgrade to the api
# service, so the browser only ever talks to one origin. That keeps the session
# cookie first-party and means no CORS exception is needed in production.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Container health probe. Deliberately not proxied to the API, so this
  # reports whether *nginx* is serving.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Hashed asset filenames are immutable, so they can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # index.html must never be cached, or a deploy leaves clients on a stale
  # bundle that references assets which no longer exist.
  #
  # The security headers are repeated here deliberately. nginx inherits
  # `add_header` from the enclosing level only when the current level declares
  # none of its own, so adding Cache-Control here would otherwise silently drop
  # every server-level header for the one response that matters most — the
  # document itself, which `location /` reaches through try_files.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    # CSV exports stream; buffering them in nginx would delay the download.
    proxy_buffering off;
  }

  # Socket.IO needs the connection upgraded and a long read timeout, or nginx
  # closes an idle WebSocket every 60 seconds.
  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Client-side routing: any unmatched path serves the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The API sets its own security headers; these cover the static bundle.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
}
